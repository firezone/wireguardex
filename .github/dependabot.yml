version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Unfortunately the github-actions ecosystem doesn't support semver cooldowns, and because they update very frequently
    # we need to disable cooldowns here. Otherwise some packages will just never get updated.
    # cooldown:
    #   default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      semver-patch-days: 2
      semver-minor-days: 7
      semver-major-days: 14
      default-days: 7

  - package-ecosystem: "cargo"
    directory: "/native/wireguard_nif"
    schedule:
      interval: "weekly"
    cooldown:
      semver-patch-days: 2
      semver-minor-days: 7
      semver-major-days: 14
      default-days: 7
